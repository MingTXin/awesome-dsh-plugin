url: https://github.com/MingTXin/dsh-remote-workstation
name: MingTXin/dsh-remote-workstation
category: remote
description:
  en: 'Remote workspaces for DeepSeek Harness: pick an SSH host in the sidebar, mount a server directory over SFTP as a workspace, and keep a plugin-owned host store with password, key or agent logins (remote files are read-only in this release).'
  zh: '给 DeepSeek Harness 用的远程工作区：在侧栏选 SSH 主机，通过 SFTP 把服务器目录挂载为工作区，主机凭据由插件自己的主机库维护（支持密码、私钥与 SSH agent；当前版本远端只读）。'
